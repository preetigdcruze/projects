name: PaySense CI

on:
  push:
    branches: [main]
    paths: ["Paynomenon/**"]
  pull_request:
    paths: ["Paynomenon/**"]

# The project lives in the Paynomenon/ folder of the repository.
defaults:
  run:
    working-directory: Paynomenon

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (format, compile, unit + integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: paysense, POSTGRES_PASSWORD: paysense, POSTGRES_DB: paysense_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paysense" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/paysense_test
      TEST_DATABASE_USER: paysense
      TEST_DATABASE_PASSWORD: paysense
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.14.3"}
      - name: Format check (ktlint)
        run: cd backend && ./gradlew ktlintCheck
      - name: Unit tests
        run: cd backend && ./gradlew test
      - name: Integration tests (PostgreSQL service + embedded Kafka)
        run: cd backend && ./gradlew integrationTest
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-test-reports, path: Paynomenon/backend/build/reports/tests}

  ai-service:
    name: AI service (lint, tests, evaluation)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: Paynomenon/ai-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: Paynomenon/ai-service/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest --cov=app --cov-report=term-missing
      - name: Deterministic evaluation (includes misbehaving-model scenarios)
        run: python -m eval.run --robustness

  frontend:
    name: Frontend (types, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: Paynomenon/frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: Paynomenon/frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright against the running stack)
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: paysense, POSTGRES_PASSWORD: paysense, POSTGRES_DB: paysense}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paysense" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PAYSENSE_DB_URL: jdbc:postgresql://localhost:5432/paysense
      PAYSENSE_DB_USER: paysense
      PAYSENSE_DB_PASSWORD: paysense
      PAYSENSE_REDIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: Paynomenon/frontend/package-lock.json}
      - name: Start backend and AI service
        run: |
          (cd backend && ./gradlew bootJar -x test -q)
          nohup java -jar backend/build/libs/paysense-backend.jar > backend.log 2>&1 &
          pip install -q -r ai-service/requirements.lock
          (cd ai-service && nohup python -m uvicorn app.main:app_factory --factory --port 8090 > ../ai.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf localhost:8080/actuator/health >/dev/null && break; sleep 2; done
          curl -sf localhost:8080/actuator/health && curl -sf localhost:8090/health
      - name: Install frontend and Playwright browser
        run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright
        run: cd frontend && npx playwright test
      - name: Demo script smoke test
        run: python3 scripts/demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            Paynomenon/frontend/playwright-report
            Paynomenon/*.log

  compose:
    name: Docker images and Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file with example configuration
        run: cp .env.example .env && docker compose --profile observability config -q
      - name: Build images
        run: docker compose build
      - name: Smoke test the full stack (Kafka transport)
        run: |
          docker compose up -d
          for i in $(seq 1 90); do curl -sf localhost:8080/actuator/health >/dev/null && break; sleep 2; done
          curl -sf localhost:8080/actuator/health
          python3 scripts/demo.py
        timeout-minutes: 15
      - if: always()
        run: docker compose logs --no-color --tail=200 || true
      - if: always()
        run: docker compose down -v
