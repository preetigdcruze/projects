[project]
name = "paysense-ai-service"
version = "0.1.0"
description = "AI intelligence layer for PaySense: read-only investigation, analytics, anomaly detection and runbook retrieval"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "E501", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"eval/*" = ["S"]
