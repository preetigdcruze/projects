global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: paysense-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /tmp/metrics_password   # written from PAYSENSE_METRICS_PASSWORD by the container entrypoint
    static_configs:
      - targets: ["backend:8080"]
  - job_name: paysense-ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8090"]   # reachable only on the compose network; the port is bound to localhost on the host
