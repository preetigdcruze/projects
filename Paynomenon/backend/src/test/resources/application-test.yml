paysense:
  scheduling-enabled: false
  redis:
    enabled: false
  simulation:
    enabled: true
    real-delay: false
  processors:
    call-timeout: 2s
    retry:
      max-attempts: 3
      initial-backoff: 5ms
      max-backoff: 20ms
      max-elapsed: 5s
    circuit-breaker:
      window-size: 10
      min-calls: 6
      failure-rate-threshold: 0.5
      open-duration: 1s
      half-open-calls: 2
  events:
    transport: in-process
    outbox:
      max-attempts: 4
      initial-backoff: 10ms
      max-backoff: 50ms
    consumer:
      max-attempts: 3
      initial-backoff: 5ms
      max-backoff: 20ms
      max-elapsed: 5s
  runbooks:
    load-on-start: true
  ai:
    base-url: http://localhost:1
    connect-timeout: 200ms
    read-timeout: 1s
spring:
  main:
    banner-mode: off
logging:
  level:
    com.paysense: WARN
    org.springframework: WARN
